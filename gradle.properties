# ==========================================
# Gradle & JVM Memory Configuration (Codespaces OOM Fix)
# ==========================================
# Ограничение памяти JVM Gradle, чтобы не превышать лимит контейнера (SIGTERM 143)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC

# ==========================================
# Fabric Loom & Decompiler Optimizations
# ==========================================
# Ограничиваем Vineflower до 1 потока, чтобы предотвратить скачки RAM при genSources
fabric.loom.vineflower.threads=1

# ==========================================
# Gradle Build Performance
# ==========================================
# Включаем кэш и параллельное выполнение тасков
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
