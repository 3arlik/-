# Суммарное ограничение памяти Gradle Daemon
org.gradle.jvmargs=-Xmx1536m -XX:+UseG1GC

# Отключение параллелизма для экономии памяти в Dev Containers
org.gradle.parallel=false
org.gradle.workers.max=1

# Отдельный жесткий лимит для Vineflower (чтобы воркер не раздувался)
fabric.loom.decompile.memory=1280m

# Fabric Properties
minecraft_version=26.2
yarn_mappings=26.2+build.1
loader_version=0.19.5
loom_version=1.17.20
fabric_api_version=0.160.0+26.2

# Mod Properties
version=1.0.0
group=com.example
